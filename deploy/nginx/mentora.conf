# Configuration nginx de référence pour le déploiement de Mentora.
#
# Ce fichier n'est PAS chargé automatiquement par docker-compose.prod.yml — nginx
# n'est pas conteneurisé dans ce projet. Il documente la configuration à installer
# sur le serveur hôte (ex. /etc/nginx/sites-available/mentora.conf) en frontal des
# conteneurs exposés par docker-compose.prod.yml :
#
#   frontend (Nuxt)      -> 127.0.0.1:3001
#   backend (Express)    -> 127.0.0.1:5001
#   glitchtip (erreurs)  -> 127.0.0.1:8001
#
# Étapes de mise en place :
#   1. apt install nginx certbot python3-certbot-nginx
#   2. Copier ce fichier vers /etc/nginx/sites-available/mentora.conf
#   3. ln -s /etc/nginx/sites-available/mentora.conf /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. certbot --nginx -d mentoraapp.online -d www.mentoraapp.online -d api.mentoraapp.online -d errors.mentoraapp.online
#      (certbot réécrit automatiquement les blocs ci-dessous en HTTPS)

# ─── Frontend : mentoraapp.online / www.mentoraapp.online ────────────────────
server {
    listen 80;
    server_name mentoraapp.online www.mentoraapp.online;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── Backend API + WebSocket : api.mentoraapp.online ──────────────────────────
server {
    listen 80;
    server_name api.mentoraapp.online;

    # Stripe envoie des webhooks en POST volumineux ; laisser une marge suffisante.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        # Nécessaire pour Socket.IO (upgrade WebSocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

# ─── Monitoring erreurs : errors.mentoraapp.online (Glitchtip) ────────────────
server {
    listen 80;
    server_name errors.mentoraapp.online;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
