version: '3.8'

services:
  db:
    image: mysql:8
    container_name: mentora_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mentora
    ports:
      - "3306:3306"
    volumes:
      - mentora_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: mentora_adminer
    restart: always
    ports:
      - "8080:8080"

  backend:
    build: ./backend
    container_name: mentora_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    volumes:
      - ./backend:/app
    command: npm run dev

  frontend:
    build: ./frontend
    container_name: mentora_frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    command: npm run dev

volumes:
  mentora_data: