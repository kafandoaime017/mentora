version: "3.9"

services:
  db:
    image: mysql:8
    container_name: mentora_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mentora
    ports:
      - "3307:3306"
    volumes:
      - mentora_data:/var/lib/mysql
    networks:
      - mentora-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: mentora_adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - mentora-net
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mentora_backend_dev
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - mentora-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: mentora_frontend_dev
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    environment:
      - CHOKIDAR_USEPOLLING=true
     
    networks:
      - mentora-net

  glitchtip-db:
    image: postgres:17-alpine
    container_name: glitchtip_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-glitchtip_dev_2025}
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip_postgres_data:/var/lib/postgresql/data
    networks:
      - mentora-net
    ports:
      - "5433:5432"

  glitchtip-valkey:
    image: valkey/valkey:8-alpine
    container_name: glitchtip_valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
      - glitchtip_valkey_data:/data
    networks:
      - mentora-net

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip_web
    restart: unless-stopped
    environment:
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-dev_secret_key_change_me}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8001}
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip_dev_2025}@glitchtip-db:5432/glitchtip
      VALKEY_URL: redis://glitchtip-valkey:6379/0
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_EMAIL:-errors@mentoraapp.online}
      ENABLE_USER_REGISTRATION: "True"
      ENABLE_ORGANIZATION_CREATION: "True"
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: 30
    depends_on:
      - glitchtip-db
      - glitchtip-valkey
    ports:
      - "8001:8000"
    networks:
      - mentora-net
    command: >
      sh -c "./manage.py migrate && ./manage.py runserver 0.0.0.0:8000"

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip_worker
    restart: unless-stopped
    environment:
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-dev_secret_key_change_me}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8001}
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip_dev_2025}@glitchtip-db:5432/glitchtip
      VALKEY_URL: redis://glitchtip-valkey:6379/0
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_EMAIL:-errors@mentoraapp.online}
    depends_on:
      - glitchtip-db
      - glitchtip-valkey
    networks:
      - mentora-net
    command: ./manage.py celery worker -l info

  umami-db:
    image: postgres:15-alpine
    container_name: umami_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami_dev_2025}
      POSTGRES_DB: umami
    volumes:
      - umami_postgres_data:/var/lib/postgresql/data
    networks:
      - mentora-net
    ports:
      - "5434:5432"

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami_dev_2025}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      HASH_SALT: ${UMAMI_HASH_SALT:-dev_hash_salt}
      APP_SECRET: ${UMAMI_APP_SECRET:-dev_app_secret}
      ENABLE_CUSTOM_DOMAINS: "false"
    depends_on:
      - umami-db
    ports:
      - "3001:3000"
    networks:
      - mentora-net

networks:
  mentora-net:
    driver: bridge

volumes:
  mentora_data:
  glitchtip_postgres_data:
  glitchtip_valkey_data:
  umami_postgres_data: