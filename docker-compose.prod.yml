version: "3.9"

services:
  db:
    image: mysql:8
    container_name: mentora_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mentora
    volumes:
      - mentora_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: mentora_adminer
    restart: always
    ports:
      - "8080:8080"

  backend:
    build: ./backend
    container_name: mentora_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mentora_frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

volumes:
  mentora_data: