version: "3.9"

services:
  db:
    image: mysql:8
    container_name: mentora_db_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - "3309:3306"  # ← CHANGÉ DE 3306 À 3309
    volumes:
      - mentora_data_prod:/var/lib/mysql
    networks:
      - mentora-net-prod
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: mentora_backend_prod
    restart: always
    ports:
      - "5001:5000"  # ← CHANGÉ DE 5000 À 5001 (optionnel)
    env_file:
      - ./backend/.env.prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
    networks:
      - mentora-net-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: mentora_frontend_prod
    restart: always
    ports:
      - "3001:3000"  # ← CHANGÉ DE 3000 À 3001 (optionnel)
    env_file:
      - ./frontend/.env.prod
    depends_on:
      - backend
    networks:
      - mentora-net-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  glitchtip-db:
    image: postgres:17-alpine
    container_name: glitchtip_db_prod
    restart: always
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD}
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip_postgres_data_prod:/var/lib/postgresql/data
    networks:
      - mentora-net-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  glitchtip-valkey:
    image: valkey/valkey:8-alpine
    container_name: glitchtip_valkey_prod
    restart: always
    command: valkey-server --appendonly yes
    volumes:
      - glitchtip_valkey_data_prod:/data
    networks:
      - mentora-net-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip_web_prod
    restart: always
    environment:
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      GLITCHTIP_DOMAIN: https://errors.mentoraapp.online
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-db:5432/glitchtip
      VALKEY_URL: redis://glitchtip-valkey:6379/0
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_EMAIL}
      ENABLE_USER_REGISTRATION: "False"
      ENABLE_ORGANIZATION_CREATION: "False"
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: 30
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_healthy
    ports:
      - "8001:8000"  # ← CHANGÉ DE 8000 À 8001 (optionnel)
    networks:
      - mentora-net-prod
    command: >
      sh -c "./manage.py migrate && ./manage.py runserver 0.0.0.0:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip_worker_prod
    restart: always
    environment:
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      GLITCHTIP_DOMAIN: https://errors.mentoraapp.online
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-db:5432/glitchtip
      VALKEY_URL: redis://glitchtip-valkey:6379/0
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_EMAIL}
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_healthy
    networks:
      - mentora-net-prod
    command: ./manage.py celery worker -l info
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  umami-db:
    image: postgres:15-alpine
    container_name: umami_db_prod
    restart: always
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
      POSTGRES_DB: umami
    volumes:
      - umami_postgres_data_prod:/var/lib/postgresql/data
    networks:
      - mentora-net-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami_prod
    restart: always
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      HASH_SALT: ${UMAMI_HASH_SALT}
      APP_SECRET: ${UMAMI_APP_SECRET}
      ENABLE_CUSTOM_DOMAINS: "false"
    depends_on:
      umami-db:
        condition: service_healthy
    ports:
      - "3002:3000"  # ← CHANGÉ DE 3001 À 3002 (optionnel)
    networks:
      - mentora-net-prod
    volumes:
      - umami_data_prod:/app/.umami
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mentora-net-prod:
    driver: bridge

volumes:
  mentora_data_prod:
  glitchtip_postgres_data_prod:
  glitchtip_valkey_data_prod:
  umami_postgres_data_prod:
  umami_data_prod: